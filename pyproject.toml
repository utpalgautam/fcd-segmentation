[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fcd-segmentation"
version = "0.1.0"
description = "Cross-platform research scaffold for FCD segmentation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "UNLICENSED - choose a project license before release" }
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
imaging = ["nibabel>=5.2,<6", "scipy>=1.11,<2", "scikit-image>=0.22,<1", "SimpleITK>=2.3,<3", "matplotlib>=3.8,<4", "pandas>=2.1,<4", "tqdm>=4.66,<5"]
deep-learning = ["torch>=2.2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.5,<1"]

[project.scripts]
fcd-check-environment = "fcd_segmentation.cli:check_environment_main"
fcd-audit-dataset = "fcd_segmentation.cli:audit_dataset_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
