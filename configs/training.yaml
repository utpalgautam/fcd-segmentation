seed: 42
device: auto
model: flair
data_config: configs/data.yaml

# Architectural / Trainer Hyperparameters
# Note: In nnU-Net v2, batch size is determined by the plans configuration (plans.json),
# while epoch count and learning rate are configured directly in the custom trainer class.
# FCDnnUNetTrainer_100epochs sets num_epochs = 100, initial_lr = 0.001, and save_every = 25.
batch_size: 1
epochs: 100
learning_rate: 0.001
num_workers: 0
mixed_precision: false
checkpoint_dir: outputs/checkpoints
experiment_dir: outputs/experiments

# nnU-Net v2 specific settings
nnunet_raw: data/processed
nnunet_preprocessed: data/nnunet_preprocessed
nnunet_results: outputs/nnunet_results

datasets:
  101: Dataset101_FLAIR
  102: Dataset102_T1
  103: Dataset103_Fusion

configuration: 3d_fullres
trainer: FCDnnUNetTrainer_100epochs
plans: nnUNetPlans
min_cases_for_five_fold: 5
keep_going: false
verify_dataset_integrity: true
